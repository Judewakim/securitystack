AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SecurityStack free scan. ONLY create this stack from a scan you started yourself
  on the SecurityStack scan page. It creates a read-only role that can see your
  security settings (the exact list is below) and nothing else: it cannot change
  anything, read files or databases, or see Lambda environment variables or EC2
  user data. Only the SecurityStack scanner can use it, and only with your scan's
  one-time External ID. Delete this stack when the scan is done.

Parameters:
  ExternalId:
    Type: String
    MinLength: 20
    MaxLength: 64
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: Unique to your scan. Generated by the SecurityStack scan page; do not change.
  ScanSuffix:
    Type: String
    AllowedPattern: "^[a-z0-9]{8}$"
    Description: Unique to your scan, so repeat scans don't collide. Generated by the scan page.

Resources:
  ScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "SecurityStackScanRole-${ScanSuffix}"
      Description: Read-only role for a one-time SecurityStack scan. Safe to delete afterwards.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # Fixed at publish time to the SecurityStack scanner's own role. It is
              # deliberately NOT a parameter, so nobody can reuse this trusted template
              # to make you grant access to a different account.
              AWS: "arn:aws:iam::000000000000:role/SecurityStackScanWorker"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: SecurityStackScanReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Exactly the read calls the scanner makes; nothing that returns data or secrets.
              - Sid: ReadSecuritySettings
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeSecurityGroups
                  - ec2:GetEbsEncryptionByDefault
                  - iam:GetAccountSummary
                  - iam:GenerateCredentialReport
                  - iam:GetCredentialReport
                  - iam:GetAccountPasswordPolicy
                  - iam:ListPolicies
                  - iam:GetPolicyVersion
                  - s3:GetAccountPublicAccessBlock
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketAcl
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:GetEventSelectors
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - securityhub:DescribeHub
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - access-analyzer:ListAnalyzers
                  - inspector2:BatchGetAccountStatus
                  - rds:DescribeDBInstances
                Resource: "*"
      Tags:
        - Key: securitystack
          Value: scan-role

Outputs:
  RoleArn:
    Description: Paste this into the SecurityStack scan page.
    Value: !GetAtt ScanRole.Arn
