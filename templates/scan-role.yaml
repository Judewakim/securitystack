AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SecurityStack free scan: a READ-ONLY role (AWS-managed SecurityAudit policy) that
  only the SecurityStack scanner can assume, and only with this scan's External ID.
  It cannot change or read data inside your resources. Delete this stack when the
  scan is done.

Parameters:
  ExternalId:
    Type: String
    MinLength: 20
    MaxLength: 64
    AllowedPattern: "^[A-Za-z0-9_-]+$"
    Description: Unique to your scan. Generated by the SecurityStack scan page; do not change.
  ScannerRoleArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::\\d{12}:role/.+$"
    Description: The SecurityStack scanner role allowed to assume this role. Filled in by the scan page.

Resources:
  ScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "SecurityStackScanRole-${AWS::Region}"
      Description: Read-only role for a one-time SecurityStack scan. Safe to delete afterwards.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ScannerRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/SecurityAudit"
      Tags:
        - Key: securitystack
          Value: scan-role

Outputs:
  RoleArn:
    Description: Paste this into the SecurityStack scan page.
    Value: !GetAtt ScanRole.Arn
