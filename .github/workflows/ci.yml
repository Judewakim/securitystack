name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk@2
      - name: Unit + infrastructure tests (no AWS access needed)
        run: pytest -q
      - name: Synth with cdk-nag (fails on any unsuppressed AWS Solutions finding)
        run: cdk synth --quiet -c withService=true
      - name: Build one-click release templates
        run: python scripts/build_release.py
      - name: Lint release templates
        run: cfn-lint --ignore-checks W3005 -- dist/*.template.json templates/*.yaml infra/*.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-templates
          path: dist/*.template.json
