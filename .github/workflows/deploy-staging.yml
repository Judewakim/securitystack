name: Deploy to staging

# Manual only. Deploys the baseline and the scan service to the staging account
# using GitHub OIDC (no stored AWS keys). One-time setup: docs/deploying.md.
on:
  workflow_dispatch:
    inputs:
      deploy_baseline:
        description: Also deploy the SecurityStack baseline into the staging account (costs ~$20-45/month after free trials)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # needed to request the OIDC token for AWS

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    # Deploy only reviewed code: the main branch. (Also restrict the "staging"
    # environment to main in GitHub settings; see docs/deploying.md.)
    if: github.ref == 'refs/heads/main'
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk@2
      - name: Test
        run: pytest -q
      - name: Build release templates (uploaded to the templates bucket by the service stack)
        run: python scripts/build_release.py
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy scan service
        run: >-
          cdk deploy SecurityStackScanService --require-approval never
          -c withService=true -c homeRegion=${{ env.AWS_REGION }}
          ${{ vars.DOMAIN_NAME && format('-c domainName={0}', vars.DOMAIN_NAME) || '' }}
          ${{ vars.CERTIFICATE_ARN && format('-c certificateArn={0}', vars.CERTIFICATE_ARN) || '' }}
          --outputs-file service-outputs.json
      - name: Deploy baseline (detects and keeps services the account already runs)
        if: ${{ inputs.deploy_baseline }}
        run: |
          cdk deploy SecurityStackHome --require-approval never \
            -c homeRegion="$AWS_REGION" \
            --parameters "SecurityStackHome:AlertEmail=$ALERT_EMAIL" \
            --outputs-file baseline-outputs.json
      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy outputs"
            for f in service-outputs.json baseline-outputs.json; do
              [ -f "$f" ] && { echo "### $f"; echo '```json'; cat "$f"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"
