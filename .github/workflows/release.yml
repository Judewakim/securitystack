name: Release

# Push a tag like v2.0.0 to publish the one-click templates as release assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk@2
      - run: pytest -q
      - run: python scripts/build_release.py
      - run: cfn-lint --ignore-checks W3005 -- dist/*.template.json templates/*.yaml
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.template.json templates/scan-role.yaml \
            --title "SecurityStack $GITHUB_REF_NAME" --generate-notes
