name: Release

# Push a tag like v2.0.0 to publish the one-click templates as release assets.
# The build job has read-only access; only the tiny publish job can write, and it
# runs no third-party installs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          npm install -g aws-cdk@2
      - run: pytest -q
      - run: python scripts/build_release.py
      - run: cfn-lint --ignore-checks W3005 -- dist/*.template.json templates/*.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-templates
          path: dist/*.template.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-templates
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.template.json \
            --repo "$GITHUB_REPOSITORY" --title "SecurityStack $GITHUB_REF_NAME" --generate-notes
