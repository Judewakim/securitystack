<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">SecurityStack baseline architecture</title>
  <desc id="d">What SecurityStack deploys inside a customer's AWS account: detection services in every region, central logging, cross-region finding aggregation, real-time alerts and a weekly report.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14213d"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e8c"/></marker>
    <style>
      .frame{fill:#f3f5f7;stroke:#14213d;stroke-width:2}
      .region{fill:#fff;stroke:#9aa7b8;stroke-width:1.5;stroke-dasharray:6 5}
      .svc{fill:#fff;stroke:#14213d;stroke-width:1.6}
      .hub{fill:#e6f2f6;stroke:#0f6e8c;stroke-width:2}
      .store{fill:#fff7e6;stroke:#8a6a00;stroke-width:1.6}
      .out{fill:#fdecea;stroke:#b42318;stroke-width:1.6}
      .h{font-size:20px;font-weight:750;fill:#14213d}
      .rh{font-size:15px;font-weight:700;fill:#4b5568}
      .n{font-size:14px;font-weight:650;fill:#14213d}
      .s{font-size:12px;fill:#4b5568}
      .l{fill:none;stroke:#14213d;stroke-width:1.6}
      .lt{fill:none;stroke:#0f6e8c;stroke-width:2}
      .ld{fill:none;stroke:#0f6e8c;stroke-width:2;stroke-dasharray:7 5}
      .lab{font-size:12px;fill:#0f6e8c;font-weight:600}
    </style>
  </defs>

  <rect x="10" y="10" width="1180" height="740" rx="14" class="frame"/>
  <text x="34" y="46" class="h">Customer AWS account</text>
  <text x="34" y="68" class="s">Deployed by SecurityStackHome (once) and SecurityStackRegion (each extra region). Every service is a switch: existing ones are left alone.</text>

  <!-- Home region -->
  <rect x="30" y="90" width="790" height="640" rx="10" class="region"/>
  <text x="50" y="118" class="rh">Home region</text>

  <!-- detection services -->
  <rect x="55" y="140" width="150" height="58" rx="8" class="svc"/><text x="70" y="165" class="n">GuardDuty</text><text x="70" y="184" class="s">threat detection</text>
  <rect x="55" y="210" width="150" height="58" rx="8" class="svc"/><text x="70" y="235" class="n">Inspector</text><text x="70" y="254" class="s">vulnerability scans</text>
  <rect x="55" y="280" width="150" height="58" rx="8" class="svc"/><text x="70" y="305" class="n">Access Analyzer</text><text x="70" y="324" class="s">external sharing</text>
  <rect x="55" y="350" width="150" height="58" rx="8" class="svc"/><text x="70" y="375" class="n">AWS Config</text><text x="70" y="394" class="s">resource inventory</text>

  <!-- Security Hub -->
  <rect x="285" y="170" width="230" height="190" rx="10" class="hub"/>
  <text x="303" y="200" class="n">Security Hub</text>
  <text x="303" y="224" class="s">AWS Foundational Security</text>
  <text x="303" y="241" class="s">Best Practices + CIS v3.0</text>
  <rect x="303" y="262" width="194" height="80" rx="7" fill="#fff" stroke="#0f6e8c" stroke-width="1.3"/>
  <text x="317" y="287" class="n">Finding aggregator</text>
  <text x="317" y="306" class="s">pulls findings from</text>
  <text x="317" y="323" class="s">every region into one place</text>

  <path d="M205 169 H245 M205 239 H245 M205 309 H245 M205 379 H245 M245 169 V379" class="l"/>
  <path d="M245 265 H283" class="l" marker-end="url(#a)"/>

  <!-- Logging -->
  <rect x="55" y="470" width="150" height="58" rx="8" class="svc"/><text x="70" y="495" class="n">CloudTrail</text><text x="70" y="514" class="s">multi-region trail</text>
  <rect x="285" y="445" width="230" height="110" rx="10" class="store"/>
  <text x="303" y="473" class="n">Log bucket (S3)</text>
  <text x="303" y="495" class="s">TLS-only, versioned, private</text>
  <text x="303" y="512" class="s">scoped to this account</text>
  <text x="303" y="529" class="s">IA 30d, Glacier IR 90d, expiry</text>
  <path d="M205 499 H283" class="l" marker-end="url(#a)"/>
  <path d="M130 408 V440 H250 V475 H283" class="l" marker-end="url(#a)"/>

  <!-- Alerts -->
  <rect x="590" y="140" width="200" height="72" rx="8" class="svc"/>
  <text x="606" y="166" class="n">EventBridge rules</text>
  <text x="606" y="185" class="s">new, active</text>
  <text x="606" y="201" class="s">HIGH / CRITICAL only</text>
  <path d="M515 210 H550 V176 H588" class="lt" marker-end="url(#at)"/>
  <text x="522" y="160" class="lab">findings</text>

  <rect x="590" y="250" width="200" height="58" rx="8" class="svc"/><text x="606" y="275" class="n">SNS topic</text><text x="606" y="294" class="s">TLS-only</text>
  <path d="M690 212 V248" class="lt" marker-end="url(#at)"/>

  <!-- weekly digest -->
  <rect x="590" y="345" width="200" height="72" rx="8" class="svc"/>
  <text x="606" y="371" class="n">Weekly digest</text>
  <text x="606" y="390" class="s">Lambda, Mondays</text>
  <text x="606" y="406" class="s">score + top issues</text>
  <path d="M515 350 H560 V390 H588" class="ld" marker-end="url(#at)"/>
  <text x="523" y="372" class="lab">reads</text>
  <path d="M690 345 V310" class="lt" marker-end="url(#at)"/>

  <rect x="590" y="455" width="200" height="72" rx="10" class="store"/>
  <text x="606" y="481" class="n">Reports bucket (S3)</text>
  <text x="606" y="500" class="s">HTML + JSON report</text>
  <text x="606" y="516" class="s">kept 2 years</text>
  <path d="M690 417 V453" class="lt" marker-end="url(#at)"/>

  <!-- Settings custom resource -->
  <rect x="55" y="600" width="460" height="100" rx="8" class="svc"/>
  <text x="72" y="626" class="n">Settings function (custom resource)</text>
  <text x="72" y="647" class="s">Turns on Inspector (no native CloudFormation resource exists).</text>
  <text x="72" y="665" class="s">Opt-in only: EBS encryption by default, account-wide S3 Block Public Access.</text>
  <text x="72" y="683" class="s">Reports failures to CloudFormation; on delete, only undoes what it did.</text>

  <!-- Email -->
  <rect x="590" y="610" width="200" height="80" rx="10" class="out"/>
  <text x="606" y="638" class="n">Your inbox</text>
  <text x="606" y="657" class="s">instant alerts +</text>
  <text x="606" y="673" class="s">weekly summary</text>
  <path d="M790 279 H805 V650 H792" class="lt" marker-end="url(#at)"/>

  <!-- Other regions -->
  <rect x="850" y="90" width="320" height="640" rx="10" class="region"/>
  <text x="870" y="118" class="rh">Each additional region</text>
  <rect x="875" y="140" width="270" height="58" rx="8" class="svc"/><text x="890" y="165" class="n">GuardDuty, Inspector</text><text x="890" y="184" class="s">same settings as home</text>
  <rect x="875" y="210" width="270" height="58" rx="8" class="svc"/><text x="890" y="235" class="n">Access Analyzer</text><text x="890" y="254" class="s">account analyzer</text>
  <rect x="875" y="280" width="270" height="58" rx="8" class="hub"/><text x="890" y="305" class="n">Security Hub</text><text x="890" y="324" class="s">linked to the home aggregator</text>
  <rect x="875" y="350" width="270" height="58" rx="8" class="svc"/><text x="890" y="375" class="n">AWS Config</text><text x="890" y="394" class="s">regional resources only</text>

  <path d="M873 309 H835 V328 H517" class="ld" marker-end="url(#at)"/>
  <path d="M873 379 H845 V542 H517" class="l" marker-end="url(#a)"/>
  <text x="880" y="450" class="s">Findings flow to the home region,</text>
  <text x="880" y="468" class="s">and Config writes to the home</text>
  <text x="880" y="486" class="s">log bucket, so alerts and reports</text>
  <text x="880" y="504" class="s">cover the whole account.</text>
</svg>
